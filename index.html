<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Roll</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #87CEEB;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            pointer-events: none;
            user-select: none;
            z-index: 100;
        }
        #instructions {
            font-size: 14px;
            margin-bottom: 5px;
        }
        #winScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            text-align: center;
            display: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            user-select: none;
            z-index: 100;
        }
        #winScreen h1 {
            font-size: 64px;
            margin-bottom: 10px;
        }
        #winScreen p {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="instructions">Use Arrow Keys or WASD to Roll | Space to Jump | Fall to Respawn</div>
    </div>
    <div id="winScreen">
        <h1>LEVEL COMPLETE!</h1>
        <p>Press R to Restart</p>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
